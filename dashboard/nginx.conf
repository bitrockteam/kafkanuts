server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store";
  }

  # Il monitoring NATS viene esposto sulla stessa origine della pagina.
  # Serve a evitare CORS nel browser: nessuna credenziale, solo endpoint di sola lettura.
  location /nats/ {
    proxy_pass http://nats:8222/;
    proxy_set_header Host $host;
    proxy_read_timeout 5s;
    proxy_connect_timeout 2s;
  }
}
