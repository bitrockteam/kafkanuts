name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, test e validazione compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: valida la configurazione Compose
        run: docker compose config --quiet

      - name: build e unit test in container
        run: docker compose --profile test run --rm --no-deps test

  secrets:
    name: ricerca segreti
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout completo
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1
