services:
  builder:
    profiles: ["bootstrap", "test"]
    build:
      context: .
      dockerfile: Dockerfile.builder
    command: ["mvn", "-B", "-ntp", "-DskipTests", "verify"]
    init: true
    cpus: "${T02_BUILDER_CPUS:-1.0}"
    mem_limit: "${T02_BUILDER_MEMORY:-1g}"
    networks: [tooling-net]
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "mvn", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    command: ["mvn", "-B", "-ntp", "verify"]
    init: true
    cpus: "${T02_TEST_CPUS:-1.0}"
    mem_limit: "${T02_TEST_MEMORY:-1g}"
    networks: [tooling-net]
    volumes:
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "mvn", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nats:
    image: nats:2.11.8-alpine
    hostname: nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
      - "--server_name=kafkanuts-nats"
    cpus: "${T17_NATS_CPUS:-0.5}"
    mem_limit: "${T17_NATS_MEMORY:-512m}"
    ports:
      - "4222:4222"
      - "8222:8222"
    networks: [nats-net]
    volumes:
      # Bind mount su percorso host, non volume gestito da Docker: lo store JetStream
      # deve restare visibile, salvabile e spostabile dal filesystem dell'host.
      - ${KAFKANUTS_DATA_DIR:-./data}/nats:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  registry-db:
    image: postgres:16.4-alpine
    hostname: registry-db
    environment:
      POSTGRES_DB: "${T17_POSTGRES_DB:-apicurio}"
      POSTGRES_USER: "${T17_POSTGRES_USER:-apicurio}"
      POSTGRES_PASSWORD: "${T17_POSTGRES_PASSWORD:-apicurio}"
      # PGDATA in una sottodirectory del mount: Postgres crea e possiede pgdata,
      # invece di pretendere owner e permessi propri sulla radice montata dall'host.
      PGDATA: /var/lib/postgresql/data/pgdata
    cpus: "${T17_POSTGRES_CPUS:-0.5}"
    mem_limit: "${T17_POSTGRES_MEMORY:-512m}"
    networks: [nats-net]
    volumes:
      - ${KAFKANUTS_DATA_DIR:-./data}/registry-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${T17_POSTGRES_USER:-apicurio} -d ${T17_POSTGRES_DB:-apicurio}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  registry:
    image: apicurio/apicurio-registry:3.0.6
    hostname: registry
    environment:
      APICURIO_STORAGE_KIND: "sql"
      APICURIO_STORAGE_SQL_KIND: "postgresql"
      APICURIO_DATASOURCE_URL: "jdbc:postgresql://registry-db:5432/${T17_POSTGRES_DB:-apicurio}"
      APICURIO_DATASOURCE_USERNAME: "${T17_POSTGRES_USER:-apicurio}"
      APICURIO_DATASOURCE_PASSWORD: "${T17_POSTGRES_PASSWORD:-apicurio}"
    depends_on:
      registry-db:
        condition: service_healthy
    cpus: "${T17_REGISTRY_CPUS:-1.0}"
    mem_limit: "${T17_REGISTRY_MEMORY:-1g}"
    ports:
      - "8081:8080"
    networks: [nats-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  order-simulator:
    image: kafkanuts/order-simulator:t17
    build:
      context: .
      dockerfile: Dockerfile.simulator
      args: {MODULE: order-simulator}
    environment:
      - TRANSPORT_MODE=nats
      - NATS_URL=nats://nats:4222
      - REGISTRY_URL=http://registry:8080/apis/ccompat/v7
    depends_on:
      nats:
        condition: service_healthy
      registry:
        condition: service_healthy
    cpus: "${T17_SIMULATOR_CPUS:-0.5}"
    mem_limit: "${T17_SIMULATOR_MEMORY:-512m}"
    networks: [nats-net]
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-simulator:
    image: kafkanuts/payment-simulator:t17
    build:
      context: .
      dockerfile: Dockerfile.simulator
      args: {MODULE: payment-simulator}
    environment:
      - TRANSPORT_MODE=nats
      - NATS_URL=nats://nats:4222
      - REGISTRY_URL=http://registry:8080/apis/ccompat/v7
    depends_on:
      nats:
        condition: service_healthy
      registry:
        condition: service_healthy
    cpus: "${T17_SIMULATOR_CPUS:-0.5}"
    mem_limit: "${T17_SIMULATOR_MEMORY:-512m}"
    networks: [nats-net]
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fulfillment-simulator:
    image: kafkanuts/fulfillment-simulator:t17
    build:
      context: .
      dockerfile: Dockerfile.simulator
      args: {MODULE: fulfillment-simulator}
    environment:
      - TRANSPORT_MODE=nats
      - NATS_URL=nats://nats:4222
      - REGISTRY_URL=http://registry:8080/apis/ccompat/v7
    depends_on:
      nats:
        condition: service_healthy
      registry:
        condition: service_healthy
    cpus: "${T17_SIMULATOR_CPUS:-0.5}"
    mem_limit: "${T17_SIMULATOR_MEMORY:-512m}"
    networks: [nats-net]
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  console:
    image: kafkanuts/console:t20
    hostname: console
    build:
      context: .
      dockerfile: Dockerfile.simulator
      args: {MODULE: console}
    environment:
      - NATS_URL=nats://nats:4222
      - REGISTRY_URL=http://registry:8080/apis/ccompat/v7
    depends_on:
      nats:
        condition: service_healthy
      registry:
        condition: service_healthy
    cpus: "${T20_CONSOLE_CPUS:-0.5}"
    mem_limit: "${T20_CONSOLE_MEMORY:-512m}"
    networks: [nats-net]
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    image: nginx:1.27-alpine
    hostname: dashboard
    depends_on:
      nats:
        condition: service_healthy
      # nginx risolve gli upstream all'avvio: senza questa attesa il proxy verso
      # console fallirebbe la partenza invece di degradare.
      console:
        condition: service_healthy
    cpus: "${T18_DASHBOARD_CPUS:-0.25}"
    mem_limit: "${T18_DASHBOARD_MEMORY:-128m}"
    ports:
      - "8090:8080"
    networks: [nats-net]
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/mapping.json:/usr/share/nginx/html/mapping.json:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 127.0.0.1 e non localhost: nginx ascolta solo su IPv4 e busybox wget
      # prova prima ::1, ottenendo connection refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  feature-suite:
    profiles: ["suite"]
    build:
      context: .
      dockerfile: Dockerfile.test
    command: ["mvn", "-B", "-ntp", "-pl", "modules/feature-suite", "-am", "test"]
    environment:
      - T18_LIVE=true
      - NATS_URL=nats://nats:4222
      - REGISTRY_URL=http://registry:8080/apis/ccompat/v7
    depends_on:
      nats:
        condition: service_healthy
      registry:
        condition: service_healthy
    init: true
    cpus: "${T02_TEST_CPUS:-1.0}"
    mem_limit: "${T02_TEST_MEMORY:-1g}"
    networks: [nats-net]
    volumes: ["maven-cache:/root/.m2"]

  smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: Dockerfile.test
    command: ["mvn", "-B", "-ntp", "test"]
    cpus: "${T02_TEST_CPUS:-1.0}"
    mem_limit: "${T02_TEST_MEMORY:-1g}"
    networks: [tooling-net]
    volumes: ["maven-cache:/root/.m2"]

networks:
  tooling-net:
    name: ${T02_NETWORK_NAME:-kafkanuts-tooling}
    driver: bridge
  nats-net:
    name: ${T17_NETWORK_NAME:-kafkanuts-nats}
    driver: bridge

volumes:
  # Resta un volume gestito: e' una cache di build, non un dato. Perderla costa
  # tempo, non informazione, e tenerla fuori da ./data evita che un rm -rf dei
  # dati porti via anche questa.
  maven-cache:
    name: ${T02_MAVEN_CACHE_VOLUME:-kafkanuts-maven-cache}
